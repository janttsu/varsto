# Every platform is built and tested on GitHub-hosted runners (free for a
# public repository): Linux and the cross-compiled Windows package on Ubuntu,
# the Windows package tested and photographed on Windows Server 2025, the
# Android app in the emulator, the native macOS app and the iOS shell on
# Apple Silicon. Two collecting jobs put the packages together as one download
# set (an unsigned SHA256SUMS; the maintainer signs it offline, RELEASING.md)
# and the screenshots in the website's names and sizes. A v* tag attaches the
# packages to a draft GitHub release. Multi-machine and cross-country tests
# run elsewhere (scripts/cloud-build, scripts/bench).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# bash with pipefail everywhere, so `cmd | tee log` fails when cmd fails.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tests, packages, screenshots)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Packages for the build and the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools mingw-w64 ffmpeg libdbus-1-dev zip python3-pil >/dev/null
          curl -fsS https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          rclone version | head -1 || true
      - name: Tests
        run: cargo test --workspace 2>&1 | tee test.log
      - name: Linux and Windows packages
        run: website/build-release.sh x86_64-unknown-linux-musl x86_64-pc-windows-gnu 2>&1 | tee build.log
      - name: Smoke test the Linux package
        run: |
          set -x
          mkdir -p smoke && tar -C smoke -xzf website/public/downloads/varsto-*-x86_64-unknown-linux-musl.tar.gz
          bin="$(ls -d "$PWD"/smoke/varsto-*/)varsto"
          file "$bin"; "$bin" --version
          echo "VARSTO_BIN=$bin" >> "$GITHUB_ENV"
      - name: Demo vault (invented user aino)
        run: |
          sudo mkdir -p /home/aino && sudo chown "$USER" /home/aino
          python3 -m pip install --quiet --break-system-packages playwright pillow
          python3 -m playwright install --with-deps chromium >/dev/null
          DEMO_HOME=/home/aino scripts/screenshots/demo-vault.sh "$VARSTO_BIN" "$RUNNER_TEMP/demo"
      - name: Screenshots of the interface
        run: python3 scripts/screenshots/ui-shots.py "$RUNNER_TEMP/demo" dist/shots
      - name: Screenshots of the Linux desktop (tray, own window)
        run: scripts/screenshots/linux-desktop.sh "$VARSTO_BIN" "$RUNNER_TEMP/demo" dist/shots
      - name: Stop the demo
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/demo/pids" ] && kill $(cat "$RUNNER_TEMP/demo/pids") 2>/dev/null || true
          tail -n 20 "$RUNNER_TEMP"/demo/*.log 2>/dev/null || true
      - name: Output to the job summary
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            { echo "## $f (last 150 lines)"; echo '```'; tail -n 150 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-windows
          path: |
            website/public/downloads/varsto-*-x86_64-unknown-linux-musl.tar.gz
            website/public/downloads/varsto-*-x86_64-pc-windows-gnu.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-linux
          path: dist/shots
          if-no-files-found: warn

  windows:
    name: Windows (smoke test, Explorer, screenshots)
    needs: linux
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-windows
          path: pkg
      - name: Smoke test on Windows
        run: |
          New-Item -ItemType Directory -Force C:\build | Out-Null
          Copy-Item (Get-ChildItem pkg\varsto-*-x86_64-pc-windows-gnu.zip | Select-Object -First 1).FullName C:\build\varsto-windows.zip
          & scripts\cloud-build\remote-windows.ps1
      - name: Screenshots of the Windows desktop (tray, own window)
        run: |
          $exe = (Get-ChildItem C:\build\unzipped -Recurse -Filter varsto.exe | Select-Object -First 1).FullName
          & scripts\screenshots\windows-desktop.ps1 -Exe $exe -Work "C:\Users\aino" -Out "$env:GITHUB_WORKSPACE\dist\shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-windows
          path: dist/shots
          if-no-files-found: warn

  android:
    name: Android (APK, emulator, screenshots)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build the APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          apps/android/build.sh 2>&1 | tee build.log
          mkdir -p dist/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/android/varsto-$version-android-debug.apk"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator - install, start, vault, screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: scripts/screenshots/android.sh dist/android/varsto-*-android-debug.apk dist/shots
      - name: Output to the job summary
        if: failure()
        run: |
          [ -f build.log ] && { echo '## build.log (last 150 lines)'; echo '```'; tail -n 150 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: dist/android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-android
          path: dist/shots
          if-no-files-found: warn

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Build Varsto.app
        run: apps/macos/build.sh --out dist 2>&1 | tee build.log
      - name: Smoke test the bundled command line
        run: |
          set -x
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/dmg" dist/Varsto-*-macos.dmg
          ls -la dmg
          test -L dmg/Applications
          mkdir -p smoke && ditto dmg/Varsto.app smoke/Varsto.app
          hdiutil detach "$PWD/dmg"
          plutil -lint smoke/Varsto.app/Contents/Info.plist
          ls -la smoke/Varsto.app/Contents/MacOS smoke/Varsto.app/Contents/Helpers
          file smoke/Varsto.app/Contents/Helpers/varsto
          codesign -dv smoke/Varsto.app
          smoke/Varsto.app/Contents/Helpers/varsto --version
      - name: Prepare a vault with a placeholder for the Finder test
        run: |
          set -x
          home="$HOME/Library/Application Support/Varsto"
          bin=smoke/Varsto.app/Contents/Helpers/varsto
          export VARSTO_PASSPHRASE=ci-finder-passphrase-1
          "$bin" --home "$home" init --name ci-mac >/dev/null
          mkdir -p "$RUNNER_TEMP/storage" "$RUNNER_TEMP/files"
          "$bin" --home "$home" storage add-local box "$RUNNER_TEMP/storage"
          "$bin" --home "$home" folder add docs "$RUNNER_TEMP/files"
          echo "hello from finder" > "$RUNNER_TEMP/files/note.txt"
          echo "second file" > "$RUNNER_TEMP/files/other.txt"
          "$bin" --home "$home" sync
          "$bin" --home "$home" folder free "$RUNNER_TEMP/files/note.txt"
          "$bin" --home "$home" folder free "$RUNNER_TEMP/files/other.txt"
          ls -la "$RUNNER_TEMP/files"
          test -f "$RUNNER_TEMP/files/note.txt.varsto-placeholder"
          # The service unlocks itself from the login keychain, like after "Remember in Keychain".
          security add-generic-password -U -s varsto -a "$home" -w "$VARSTO_PASSPHRASE"
      - name: Launch the app and capture its window
        run: |
          open smoke/Varsto.app
          sleep 12
          pgrep -x Varsto >/dev/null && echo "app process running" || { echo "app process NOT running"; exit 1; }
          mkdir -p dist/shots/raw
          screencapture -x dist/shots/raw/macos-desktop.png
          # The app's own window only: system prompts on the runner (local
          # network access for the runner agent) stay out of the picture.
          cat > "$RUNNER_TEMP/winid.swift" <<'SWIFT'
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in list where (w[kCGWindowOwnerName as String] as? String) == "Varsto" && (w[kCGWindowLayer as String] as? Int) == 0 {
            print(w[kCGWindowNumber as String] as? Int ?? 0); break
          }
          SWIFT
          wid="$(swift "$RUNNER_TEMP/winid.swift" | head -1)"
          echo "Varsto window: ${wid:-not found}"
          if [ -n "$wid" ]; then screencapture -x -o -l "$wid" dist/shots/macos-app.png; else cp dist/shots/raw/macos-desktop.png dist/shots/macos-app.png; fi
      - name: Finder - double-click a placeholder, Services menu entries
        run: |
          set -x
          /System/Library/CoreServices/pbs -update || true
          /System/Library/CoreServices/pbs -dump_pboard 2>/dev/null | grep -i "with Varsto" || echo "services not listed (registration needs Varsto.app in Applications)"
          open "$RUNNER_TEMP/files/note.txt.varsto-placeholder"
          for i in $(seq 1 30); do [ -f "$RUNNER_TEMP/files/note.txt" ] && break; sleep 1; done
          ls -la "$RUNNER_TEMP/files"
          grep -q "hello from finder" "$RUNNER_TEMP/files/note.txt"
          test ! -e "$RUNNER_TEMP/files/note.txt.varsto-placeholder"
          # Services, the way Finder calls them (best effort on a runner).
          cat > "$RUNNER_TEMP/svc.swift" <<'SWIFT'
          import AppKit
          let pb = NSPasteboard(name: NSPasteboard.Name("varsto-ci"))
          pb.clearContents()
          pb.writeObjects([URL(fileURLWithPath: CommandLine.arguments[1]) as NSURL])
          print("NSPerformService:", NSPerformService(CommandLine.arguments[2], pb))
          SWIFT
          swift "$RUNNER_TEMP/svc.swift" "$RUNNER_TEMP/files/other.txt.varsto-placeholder" "Download with Varsto" || true
          for i in $(seq 1 15); do [ -f "$RUNNER_TEMP/files/other.txt" ] && break; sleep 1; done
          [ -f "$RUNNER_TEMP/files/other.txt" ] && echo "Services download worked" || echo "Services download not verified on this runner"
          screencapture -x dist/macos-finder.png
          osascript -e 'tell application "Varsto" to quit' || pkill -x Varsto || true
          sleep 2
          pgrep -x varsto >/dev/null && { echo "service still running after quit"; pkill -x varsto; } || echo "service stopped with the app"
      - name: Output to the job summary
        if: failure()
        run: |
          { echo '## build.log (last 150 lines)'; echo '```'; tail -n 150 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Varsto-macos
          path: |
            dist/Varsto-*-macos.dmg
            dist/shots
            dist/macos-finder.png
            build.log
          if-no-files-found: warn

  ios:
    name: iOS app (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Build for the Simulator
        run: apps/ios/build.sh 2>&1 | tee build.log
      - name: Launch on the Simulator and take a screenshot
        run: apps/ios/simshot.sh dist/ios 2>&1 | tee simshot.log
      - name: Output to the job summary
        if: failure()
        run: |
          for f in build.log simshot.log; do
            [ -f "$f" ] || continue
            { echo "## $f (last 150 lines)"; echo '```'; tail -n 150 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Varsto-ios-simulator
          path: |
            dist/ios
            build.log
            simshot.log
          if-no-files-found: warn

  downloads:
    name: Download set (and draft release on tags)
    needs: [linux, android, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assemble
        run: |
          mkdir -p dist/downloads
          find art/packages-linux-windows art/packages-android -type f -exec cp {} dist/downloads/ \;
          cp art/Varsto-macos/dist/Varsto-*-macos.dmg dist/downloads/ 2>/dev/null || find art/Varsto-macos -name 'Varsto-*-macos.dmg' -exec cp {} dist/downloads/ \;
          website/assemble-release.sh dist/downloads
          ls -la dist/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: dist/downloads
          if-no-files-found: error
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --prerelease --title "$tag" --generate-notes
          gh release upload "$tag" dist/downloads/* --clobber

  screenshots:
    name: Screenshots for the website
    needs: [linux, windows, android, macos, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Website names and sizes
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          python3 scripts/screenshots/finalize.py art dist/screenshots --version "$version" --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --source "GitHub Actions run ${{ github.run_number }}"
          cat dist/screenshots/shots.json
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshots
          if-no-files-found: error
      - name: Publish for the website (rolling pre-release screenshots-latest)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C dist/screenshots -czf screenshots.tar.gz .
          gh release view screenshots-latest >/dev/null 2>&1 || gh release create screenshots-latest --prerelease --latest=false \
            --title "Screenshots of the newest build" --notes "Pictures CI takes on every build of main; the website pulls them from here. Not a software release."
          gh release upload screenshots-latest screenshots.tar.gz --clobber
