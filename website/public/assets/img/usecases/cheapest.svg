<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="An assistant compares storage prices from open data and proposes a move the user confirms">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#edf1fd"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".07"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4472f4"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0f3fc"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eaf0ff"/><stop offset="1" stop-color="#d6e0fb"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5970"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ebf3"/><stop offset="1" stop-color="#b9c4d6"/></linearGradient><radialGradient id="hl" cx=".28" cy=".12" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="cg" gradientUnits="userSpaceOnUse" cx="-14" cy="-26" r="72"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ecfc"/></radialGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b3a9a" flood-opacity=".15"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<rect x="168" y="34" width="440" height="40" rx="14" fill="url(#pg)" filter="url(#sh)"/><rect x="168" y="34" width="440" height="40" rx="14" fill="url(#hl)"/><text x="388" y="59" class="m" style="font-size:13px;font-weight:600;fill:#fff">You: "What is the cheapest place to keep the 2019 videos?"</text><rect x="32" y="90" width="500" height="148" rx="14" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/><rect x="32" y="90" width="500" height="148" rx="14" fill="url(#hl)"/><circle cx="58" cy="114" r="10" fill="url(#pg)"/><path d="M58 108 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 l4.4 -1.6z" fill="#fff"/><text x="76" y="119" class="t">Assistant (MCP)</text><text x="48" y="144" class="s">310 GB, read twice a year. Cold tier at provider C would cost about a third of</text><text x="48" y="162" class="s">the current hot bucket; restore takes hours and costs per GB.</text><text x="48" y="188" class="n">Proposed: move 2019 videos to provider C cold; keep one hot copy at home.</text><rect x="48" y="202" width="92" height="26" rx="13.0" fill="url(#pg)" filter="url(#sh)"/><rect x="48" y="202" width="92" height="26" rx="13.0" fill="url(#hl)"/><text x="94.0" y="219.3" class="w m">Confirm</text><text x="320" y="294" class="s m">Open, dated price data; nothing moves without your confirmation.</text>
</svg>
