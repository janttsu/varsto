<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A stolen laptop: Strongroom stays locked, the device is revoked and wiped from another device">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="lock"><path d="M-5 -1 V-6.5 a5 5 0 0 1 10 0 V-1" fill="none" stroke="#1b3a9a" stroke-width="2.4" stroke-linecap="round"/><rect x="-8.5" y="-1.5" width="17" height="13.5" rx="3.2" fill="url(#pg)"/><circle cy="4" r="1.9" fill="#fff"/><rect x="-.9" y="4.5" width="1.8" height="3.6" rx=".9" fill="#fff"/></g><g id="ok"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#2bb673"/><path d="M-4.5 .2 L-1.2 3.4 L5 -3.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="x"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#e0535a"/><path d="M-3.6 -3.6 L3.6 3.6 M3.6 -3.6 L-3.6 3.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><g id="laptop" filter="url(#sh)"><rect x="-50" y="-36" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-31" width="90" height="54" rx="3" fill="url(#sg)"/><rect x="-62" y="30" width="124" height="8" rx="4" fill="#cbd5e1"/><rect x="-12" y="30" width="24" height="3" rx="1.5" fill="#e8edf7"/></g><g id="phone" filter="url(#sh)"><rect x="-22" y="-42" width="44" height="84" rx="9" fill="url(#dg)"/><rect x="-19" y="-36" width="38" height="70" rx="5" fill="url(#sg)"/><rect x="-6" y="-40.5" width="12" height="2.5" rx="1.25" fill="#7c8aa3"/><rect x="-8" y="37" width="16" height="2.5" rx="1.25" fill="#7c8aa3"/></g><g id="cloud" filter="url(#sh)"><path transform="translate(-3 10)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#laptop" x="150" y="146"/><use href="#lock" transform="translate(150 134) scale(1.6)"/><path d="M128 164 h44" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/><use href="#x" x="198" y="112"/><text x="150" y="210" class="t m">Stolen laptop</text><text x="150" y="228" class="s m">Strongroom stays locked</text><use href="#phone" x="480" y="156"/><rect x="466" y="130" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><rect x="466" y="145" width="28" height="9" rx="2" fill="#e0535a" fill-opacity=".85"/><rect x="466" y="160" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><rect x="466" y="175" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><text x="480" y="224" class="t m">Your phone</text><path class="d" d="M456 118 C 420 68, 250 58, 208 106"/><text x="332" y="64" class="t m">revoke + wipe</text><use href="#cloud" x="320" y="252"/><use href="#ok" x="354" y="236"/><text x="320" y="296" class="s m">data still restorable from your storages</text>
</svg>
