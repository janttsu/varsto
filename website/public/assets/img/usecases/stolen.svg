<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#laptop" x="150" y="146"/><use href="#lock" transform="translate(150 134) scale(1.6)"/><path d="M128 164 h44" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/><use href="#x" x="198" y="112"/><text x="150" y="210" class="t m">Stolen laptop</text><text x="150" y="228" class="s m">Strongroom stays locked</text><use href="#phone" x="480" y="156"/><rect x="466" y="132" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><rect x="466" y="147" width="28" height="9" rx="2" fill="#e0535a" fill-opacity=".85"/><rect x="466" y="162" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><rect x="466" y="177" width="28" height="9" rx="2" fill="#8aa9ff" fill-opacity=".35"/><text x="480" y="224" class="t m">Your phone</text><path class="d" d="M456 118 C 420 68, 250 58, 208 106"/><text x="332" y="64" class="t m">revoke + wipe</text><use href="#cloud" x="320" y="258"/><use href="#ok" x="354" y="234"/><text x="320" y="294" class="s m">data still restorable from your storages</text>
