<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A phone camera roll uploads encrypted and frees space once copies are verified">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="lock"><path d="M-5 -1 V-6.5 a5 5 0 0 1 10 0 V-1" fill="none" stroke="#1b3a9a" stroke-width="2.4" stroke-linecap="round"/><rect x="-8.5" y="-1.5" width="17" height="13.5" rx="3.2" fill="url(#pg)"/><circle cy="4" r="1.9" fill="#fff"/><rect x="-.9" y="4.5" width="1.8" height="3.6" rx=".9" fill="#fff"/></g><g id="lockb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#lock" y="-3"/></g><g id="ok"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#2bb673"/><path d="M-4.5 .2 L-1.2 3.4 L5 -3.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="phone" filter="url(#sh)"><rect x="-22" y="-42" width="44" height="84" rx="9" fill="url(#dg)"/><rect x="-19" y="-36" width="38" height="70" rx="5" fill="url(#sg)"/><rect x="-6" y="-40.5" width="12" height="2.5" rx="1.25" fill="#7c8aa3"/><rect x="-8" y="37" width="16" height="2.5" rx="1.25" fill="#7c8aa3"/></g><g id="cloud" filter="url(#sh)"><path transform="translate(-3 10)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/></g><g id="disk" filter="url(#sh)"><rect x="-40" y="-15" width="80" height="30" rx="6" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2"/><circle cx="-22" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="-22" r="2" fill="#cbd5e1"/><path d="M-8 -4 h14 M-8 4 h10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><circle cx="26" r="6" fill="#2bb673" fill-opacity=".22"/><circle cx="26" r="3" fill="#2bb673"/></g><g id="cam"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><rect x="-8" y="-5" width="16" height="11" rx="2.5" fill="url(#pg)"/><rect x="-3.5" y="-7.5" width="7" height="3" rx="1" fill="#1b3a9a"/><circle cy=".5" r="3" fill="#fff"/><circle cy=".5" r="1.4" fill="#2b57d6"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#phone" x="140" y="150"/><rect x="124" y="118" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="136" y="118" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".85"/><rect x="148" y="118" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".4"/><rect x="124" y="130" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".7"/><rect x="136" y="130" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="148" y="130" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".9"/><rect x="124" y="142" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="136" y="142" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="148" y="142" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".85"/><rect x="124" y="154" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".4"/><rect x="136" y="154" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".7"/><rect x="148" y="154" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="124" y="166" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".9"/><rect x="136" y="166" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="148" y="166" width="10" height="10" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="124" y="180" width="34" height="4" rx="2" fill="#e2e8f0"/><rect x="124" y="180" width="32" height="4" rx="2" fill="#e0535a"/><use href="#cam" x="168" y="112"/><text x="140" y="216" class="t m">Camera roll full</text><path class="d" d="M172 136 C 220 110, 280 104, 318 112"/><use href="#cloud" x="370" y="120"/><rect x="348" y="113" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="364" y="113" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="380" y="113" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><use href="#lockb" x="404" y="100"/><text x="370" y="170" class="t m">Encrypted upload</text><path class="d" d="M414 134 C 460 150, 490 175, 506 204"/><use href="#disk" x="520" y="224"/><use href="#ok" x="552" y="202"/><text x="520" y="258" class="s m">second copy verified</text><text x="320" y="294" class="s m">"Free up space" deletes originals only after the policy is met and verified.</text>
</svg>
