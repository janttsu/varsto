<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A new small phone shows the whole tree as placeholders and downloads only what is needed">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="ok"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#2bb673"/><path d="M-4.5 .2 L-1.2 3.4 L5 -3.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="key"><circle cx="-9" r="6.5" fill="none" stroke="#2b57d6" stroke-width="3"/><path d="M-2.5 0 H16 M10 0 v5 M15 0 v4" stroke="#2b57d6" stroke-width="3" fill="none" stroke-linecap="round"/></g><g id="keyb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#key" transform="scale(.8)"/></g><g id="phone" filter="url(#sh)"><rect x="-22" y="-42" width="44" height="84" rx="9" fill="url(#dg)"/><rect x="-19" y="-36" width="38" height="70" rx="5" fill="url(#sg)"/><rect x="-6" y="-40.5" width="12" height="2.5" rx="1.25" fill="#7c8aa3"/><rect x="-8" y="37" width="16" height="2.5" rx="1.25" fill="#7c8aa3"/></g><g id="fo"><path d="M-9 -7 h6 l2 2 h9 a1.5 1.5 0 0 1 1.5 1.5 v9 a1.5 1.5 0 0 1 -1.5 1.5 h-17 a1.5 1.5 0 0 1 -1.5 -1.5 v-11 a1.5 1.5 0 0 1 1.5 -1.5z" fill="#dbe4ff" stroke="#8aa9ff" stroke-width="1.5" stroke-linejoin="round"/></g><g id="pc"><path transform="translate(-.5 -1.5) scale(.2)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="none" stroke="#8aa9ff" stroke-width="9" stroke-linejoin="round"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#phone" x="130" y="150"/><rect x="114" y="122" width="34" height="8" rx="2" fill="#8aa9ff" fill-opacity=".3"/><rect x="120" y="135" width="28" height="8" rx="2" fill="#8aa9ff" fill-opacity=".3"/><rect x="120" y="148" width="28" height="8" rx="2" fill="#8aa9ff" fill-opacity=".75"/><rect x="114" y="161" width="34" height="8" rx="2" fill="#8aa9ff" fill-opacity=".75"/><rect x="114" y="174" width="34" height="8" rx="2" fill="#8aa9ff" fill-opacity=".3"/><use href="#keyb" x="160" y="114"/><text x="130" y="216" class="t m">New phone</text><text x="130" y="234" class="s m">joined with a key</text><rect x="240" y="50" width="350" height="200" rx="12" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/><path d="M266 88 V 148" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><use href="#fo" x="262" y="76"/><text x="278" y="81" class="t">Photos/</text><text x="470" y="80.5" class="s e"></text><text x="556" y="80.5" class="s e"></text><use href="#fo" x="286" y="106"/><text x="302" y="110.5" class="n">2019/</text><text x="470" y="110.5" class="s e">48 GB</text><text x="556" y="110.5" class="s e">placeholder</text><use href="#pc" x="572" y="107"/><use href="#fo" x="286" y="136"/><text x="302" y="140.5" class="n">2024/</text><text x="470" y="140.5" class="s e">31 GB</text><text x="556" y="140.5" class="s e">placeholder</text><use href="#pc" x="572" y="137"/><use href="#fo" x="286" y="166"/><text x="302" y="170.5" class="n">2026/</text><text x="470" y="170.5" class="s e">2.1 GB</text><text x="556" y="170.5" class="s e">downloaded</text><use href="#ok" transform="translate(572 166) scale(.85)"/><use href="#fo" x="262" y="196"/><text x="278" y="201" class="t">Documents/</text><text x="470" y="200.5" class="s e">400 MB</text><text x="556" y="200.5" class="s e">downloaded</text><use href="#ok" transform="translate(572 196) scale(.85)"/><use href="#fo" x="262" y="226"/><text x="278" y="231" class="t">Video/</text><text x="470" y="230.5" class="s e">1.2 TB</text><text x="556" y="230.5" class="s e">placeholder</text><use href="#pc" x="572" y="227"/><path class="d" d="M160 150 C 190 140, 210 130, 234 120"/><text x="320" y="294" class="s m">A 128 GB phone can see a 2 TB vault. Tap a file to fetch it.</text>
</svg>
