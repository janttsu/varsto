 y="231" class="t">Video/</text><text x="470" y="230.5" class="s e">1.2 TB</text><text x="556" y="230.5" class="s e">placeholder</text><use href="#pc" x="572" y="226"/><path class="d" d="M160 150 C 190 140, 210 130, 234 120"/><text x="320" y="294" class="s m">A 128 GB phone can see a 2 TB vault. Tap a file to fetch it.</text>
