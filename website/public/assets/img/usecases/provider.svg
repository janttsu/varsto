<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="One provider shuts down; copies exist elsewhere and the app repairs and drains">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="ok"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#2bb673"/><path d="M-4.5 .2 L-1.2 3.4 L5 -3.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="x"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#e0535a"/><path d="M-3.6 -3.6 L3.6 3.6 M3.6 -3.6 L-3.6 3.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><g id="laptop" filter="url(#sh)"><rect x="-50" y="-36" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-31" width="90" height="54" rx="3" fill="url(#sg)"/><rect x="-62" y="30" width="124" height="8" rx="4" fill="#cbd5e1"/><rect x="-12" y="30" width="24" height="3" rx="1.5" fill="#e8edf7"/></g><g id="cloud" filter="url(#sh)"><path transform="translate(-3 10)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/></g><g id="disk" filter="url(#sh)"><rect x="-40" y="-15" width="80" height="30" rx="6" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2"/><circle cx="-22" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="-22" r="2" fill="#cbd5e1"/><path d="M-8 -4 h14 M-8 4 h10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><circle cx="26" r="6" fill="#2bb673" fill-opacity=".22"/><circle cx="26" r="3" fill="#2bb673"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#cloud" x="130" y="116" opacity=".55"/><use href="#x" x="164" y="96"/><text x="130" y="166" class="t m">Provider A closed</text><use href="#cloud" x="320" y="116"/><rect x="298" y="109" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="314" y="109" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="330" y="109" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><use href="#ok" x="354" y="96"/><text x="320" y="166" class="t m">Provider B</text><use href="#disk" x="510" y="118"/><use href="#ok" x="544" y="96"/><text x="510" y="166" class="t m">Disk at home</text><use href="#laptop" x="320" y="232"/><rect x="282" y="212" width="76" height="14" rx="4" fill="#e0535a" fill-opacity=".14"/><circle cx="291" cy="219" r="3.5" fill="#e0535a"/><path d="M300 219 h30" stroke="#e0535a" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".6"/><rect x="282" y="232" width="8" height="8" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="295" y="232" width="8" height="8" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="308" y="232" width="8" height="8" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="321" y="232" width="8" height="8" rx="2.5" fill="#8aa9ff" fill-opacity=".8"/><rect x="334" y="232" width="8" height="8" rx="2.5" fill="#8aa9ff" fill-opacity=".3"/><path class="d" d="M320 190 L 320 148"/><path class="d" d="M374 204 C 420 182, 460 160, 488 140"/><text x="320" y="296" class="s m">alert: 1 of 3 copies lost, repairing to a new storage</text>
