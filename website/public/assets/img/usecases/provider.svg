<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="One provider shuts down; copies exist elsewhere and the app repairs and drains">
<defs>
<g id="lock"><rect x="-8" y="-2" width="16" height="12" rx="3" fill="#2b57d6"/><path d="M-4.5 -2 V-6 a4.5 4.5 0 0 1 9 0 V-2" fill="none" stroke="#2b57d6" stroke-width="2.4"/><circle cx="0" cy="4" r="1.8" fill="#fff"/></g>
<g id="device"><rect x="-44" y="-30" width="88" height="56" rx="6" fill="#fff" fill-opacity="0.95" stroke="#8aa9ff" stroke-width="2"/><rect x="-54" y="26" width="108" height="6" rx="3" fill="#8aa9ff"/></g>
<g id="phone"><rect x="-20" y="-38" width="40" height="72" rx="7" fill="#fff" fill-opacity="0.95" stroke="#8aa9ff" stroke-width="2"/><circle cy="29" r="2.4" fill="#8aa9ff"/></g>
<g id="disk"><rect x="-40" y="-16" width="80" height="32" rx="5" fill="#eef2ff" stroke="#8aa9ff" stroke-width="2"/><circle cx="28" cy="0" r="3" fill="#2bb673"/></g>
<g id="cloud"><path d="M-40 10 a16 16 0 0 1 10 -30 a20 20 0 0 1 38 -4 a14 14 0 0 1 22 20 a12 12 0 0 1 -6 22 h-58 a13 13 0 0 1 -6 -8z" fill="#fff" fill-opacity="0.95" stroke="#8aa9ff" stroke-width="2"/></g>
<g id="house"><path d="M-40 0 L0 -34 L40 0 V36 H-40 Z" fill="#fff" fill-opacity="0.95" stroke="#8aa9ff" stroke-width="2"/><rect x="-10" y="12" width="20" height="24" fill="#8aa9ff"/></g>
<g id="file"><path d="M-14 -20 h18 l10 10 v30 h-28 z" fill="#fff" stroke="#8aa9ff" stroke-width="2"/><path d="M4 -20 v10 h10" fill="none" stroke="#8aa9ff" stroke-width="2"/></g>
<g id="key"><circle r="7" fill="none" stroke="#2b57d6" stroke-width="3"/><path d="M6 2 L24 2 M18 2 v6 M22 2 v4" stroke="#2b57d6" stroke-width="3" fill="none"/></g>
<g id="x"><circle r="10" fill="#e0535a"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#fff" stroke-width="2.5"/></g>
<g id="ok"><circle r="10" fill="#2bb673"/><path d="M-5 0 L-1 4 L6 -4" stroke="#fff" stroke-width="2.5" fill="none"/></g>
</defs>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .t{font-size:14px;font-weight:600;fill:#334155} .s{font-size:12px;fill:#6b7a90} .d{stroke:#8aa9ff;stroke-width:2.5;stroke-dasharray:6 6;fill:none} .l{stroke:#8aa9ff;stroke-width:2.5;fill:none}</style>

<use href="#cloud" x="130" y="130"/><use href="#x" x="162" y="112"/><text x="130" y="165" text-anchor="middle" class="t">Provider A closed</text>
<use href="#cloud" x="320" y="130"/><use href="#ok" x="352" y="112"/><text x="320" y="165" text-anchor="middle" class="t">Provider B</text>
<use href="#disk" x="510" y="125"/><use href="#ok" x="542" y="100"/><text x="510" y="165" text-anchor="middle" class="t">Disk at home</text>
<use href="#device" x="320" y="250"/><text x="320" y="305" text-anchor="middle" class="s">alert: 1 of 3 copies lost, repairing to a new storage</text>
<path class="d" d="M300 215 C 280 190, 260 170, 240 150"/><path class="d" d="M340 215 C 380 190, 440 170, 470 150"/>

</svg>
