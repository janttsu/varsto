<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A device decrypts on demand and shows thumbnails made once by another device">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="lock"><path d="M-5 -1 V-6.5 a5 5 0 0 1 10 0 V-1" fill="none" stroke="#1b3a9a" stroke-width="2.4" stroke-linecap="round"/><rect x="-8.5" y="-1.5" width="17" height="13.5" rx="3.2" fill="url(#pg)"/><circle cy="4" r="1.9" fill="#fff"/><rect x="-.9" y="4.5" width="1.8" height="3.6" rx=".9" fill="#fff"/></g><g id="lockb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#lock" y="-3"/></g><g id="monitor" filter="url(#sh)"><rect x="-50" y="-38" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-33" width="90" height="56" rx="3" fill="url(#sg)"/><rect x="-7" y="28" width="14" height="10" fill="#94a3b8"/><rect x="-26" y="36" width="52" height="5" rx="2.5" fill="#cbd5e1"/></g><g id="phone" filter="url(#sh)"><rect x="-22" y="-42" width="44" height="84" rx="9" fill="url(#dg)"/><rect x="-19" y="-36" width="38" height="70" rx="5" fill="url(#sg)"/><rect x="-6" y="-40.5" width="12" height="2.5" rx="1.25" fill="#7c8aa3"/><rect x="-8" y="37" width="16" height="2.5" rx="1.25" fill="#7c8aa3"/></g><g id="cloud" filter="url(#sh)"><path transform="translate(-3 10)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#monitor" x="150" y="146"/><rect x="118" y="122" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="136" y="122" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".85"/><rect x="154" y="122" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".4"/><rect x="172" y="122" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".7"/><rect x="118" y="140" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="136" y="140" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".9"/><rect x="154" y="140" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="172" y="140" width="14" height="14" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><text x="150" y="208" class="t m">Desktop</text><text x="150" y="226" class="s m">has the photos, makes thumbnails</text><path class="d" d="M204 126 C 238 100, 262 96, 288 102"/><use href="#cloud" x="340" y="110"/><rect x="318" y="103" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="334" y="103" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="350" y="103" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><use href="#lockb" x="374" y="90"/><text x="340" y="162" class="s m">thumbs/&lt;folder&gt;/&lt;hash&gt;.enc</text><path class="d" d="M386 128 C 420 148, 450 150, 482 150"/><use href="#phone" x="510" y="160"/><rect x="497" y="128" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="513" y="128" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".85"/><rect x="497" y="144" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".4"/><rect x="513" y="144" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".7"/><rect x="497" y="160" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="513" y="160" width="12" height="12" rx="1.5" fill="#8aa9ff" fill-opacity=".9"/><text x="510" y="228" class="t m">Phone</text><text x="510" y="246" class="s m">previews, files are placeholders</text><text x="320" y="294" class="s m">Thumbnails are encrypted under the folder key; the storage sees only ciphertext.</text>
</svg>
