<path d="M130 412 Q 600 560 1070 412" fill="none" stroke="#8aa9ff" stroke-opacity=".35" stroke-width="2"/><path class="d" d="M523 235 C 445 270, 130 264, 130 344"/><path class="d" d="M537 255 C 472 312, 318 268, 318 348"/><path class="d" d="M572 279 C 543 360, 506 306, 506 386"/><path class="d" d="M628 279 C 657 360, 694 322, 694 402"/><path class="d" d="M663 255 C 728 312, 882 308, 882 388"/><path class="d" d="M677 235 C 755 270, 1070 252, 1070 332"/><use href="#laptop" transform="translate(130 412) scale(1.3)"/><text x="130" y="486" class="m" style="font-size:16px;font-weight:600;fill:#334155">Laptop</text><use href="#shelf" transform="translate(318 448) scale(1.05)"/><text x="318" y="540" class="m" style="font-size:16px;font-weight:600;fill:#334155">Disks on a shelf</text><text x="318" y="560" class="m" style="font-size:13px;font-weight:400;fill:#6b7a90">offline, counted, verified</text><use href="#bucket" transform="translate(506 462) scale(1.4)"/><text x="506" y="540" class="m" style="font-size:16px;font-weight:600;fill:#334155">S3 bucket</text><text x="506" y="560" class="m" style="font-size:13px;font-weight:400;fill:#6b7a90">hot copy, any provider</text><use href="#archive" transform="translate(694 466) scale(1.5)"/><text x="694" y="540" class="m" style="font-size:16px;font-weight:600;fill:#334155">Cold archive</text><text x="694" y="560" class="m" style="font-size:13px;font-weight:400;fill:#6b7a90">never read by surprise</text><use href="#nas" transform="translate(882 448) scale(1.4)"/><text x="882" y="512" class="m" style="font-size:16px;font-weight:600;fill:#334155">NAS at home</text><text x="882" y="532" class="m" style="font-size:13px;font-weight:400;fill:#6b7a90">or a friend's, or a server</text><use href="#phone" transform="translate(1070 412) scale(1.3)"/><text x="1070" y="492" class="m" style="font-size:16px;font-weight:600;fill:#334155">Phone</text><rect x="76" y="376" width="108" height="64" rx="3" fill="url(#cb)"/><rect x="1048" y="372" width="44"