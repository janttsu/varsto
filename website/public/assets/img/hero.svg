 id="bucket" filter="url(#sh)"><path d="M-46 -26 L-37 42 H37 L46 -26z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/><path d="M-46 -26 L-37 42 H37 L46 -26z" fill="url(#hl)"/><ellipse cx="0" cy="-26" rx="46" ry="11" fill="url(#sg)" stroke="#8aa9ff" stroke-width="2"/></g><g id="shelf"><rect x="-75" y="-70" width="150" height="140" rx="12" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2" filter="url(#sh)"/><rect x="-75" y="-70" width="150" height="140" rx="12" fill="url(#hl)"/><path d="M-67 -21 H67 M-67 25 H67" stroke="#e8edf7" stroke-width="3"/><use href="#disk" y="-44"/><use href="#disk" y="2"/><use href="#disk" y="48"/></g></defs>
