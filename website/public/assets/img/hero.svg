<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Your data in many places, encrypted behind your own keys</title>
  <desc id="d">A key held by the user in the centre. Lines lead to an S3 bucket, a cold archive, hard drives on a shelf, a laptop, a phone and a network drive. Every place holds only locked, encrypted blocks.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b57d6"/>
      <stop offset="1" stop-color="#6f8fe8"/>
    </linearGradient>
    <pattern id="blocks" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="10" height="10" rx="2" fill="#8aa9ff" fill-opacity="0.35"/>
    </pattern>
    <g id="lock">
      <rect x="-9" y="-2" width="18" height="14" rx="3" fill="#2b57d6"/>
      <path d="M-5 -2 V-7 a5 5 0 0 1 10 0 V-2" fill="none" stroke="#2b57d6" stroke-width="2.6"/>
      <circle cx="0" cy="5" r="2" fill="#ffffff"/>
    </g>
    <g id="enc">
      <rect x="-44" y="-26" width="88" height="52" rx="8" fill="url(#blocks)" stroke="#8aa9ff" stroke-opacity="0.6"/>
      <use href="#lock" x="30" y="-16"/>
    </g>
  </defs>

  <!-- connection lines: dashed = encrypted traffic -->
  <g stroke="#8aa9ff" stroke-width="2.5" stroke-dasharray="7 7" fill="none" opacity="0.9">
    <path d="M600 280 C 600 200, 300 200, 190 150"/>
    <path d="M600 280 C 600 220, 950 220, 1010 150"/>
    <path d="M600 280 C 520 300, 320 320, 190 400"/>
    <path d="M600 280 C 680 300, 900 320, 1010 400"/>
    <path d="M600 280 C 560 350, 480 420, 430 470"/>
    <path d="M600 280 C 640 350, 720 420, 770 470"/>
  </g>

  <!-- centre: your key -->
  <g transform="translate(600 280)">
    <circle r="78" fill="url(#g)"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
    <g fill="#ffffff" transform="translate(-30 0)">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#ffffff" stroke-width="9"/>
      <rect x="14" y="-4.5" width="52" height="9" rx="3"/>
      <rect x="48" y="2" width="8" height="14" rx="2"/>
      <rect x="60" y="2" width="8" height="18" rx="2"/>
    </g>
    <text y="112" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2b57d6">Your keys</text>
    <text y="134" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7a90">never leave your devices</text>
  </g>

  <!-- S3 bucket -->
  <g transform="translate(190 120)">
    <path d="M-50 -30 h100 l-12 70 h-76 z" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="50" ry="12" fill="#eef2ff" stroke="#8aa9ff" stroke-width="2"/>
    <use href="#enc" transform="translate(0 10) scale(0.72)"/>
    <text y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#334155">S3 bucket</text>
    <text y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a90">hot copy, any provider</text>
  </g>

  <!-- Glacier / cold archive -->
  <g transform="translate(1010 120)">
    <path d="M0 -58 l48 28 v56 l-48 28 l-48 -28 v-56 z" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <g stroke="#8aa9ff" stroke-width="2.5" stroke-linecap="round">
      <path d="M0 -36 v72 M-31 -18 l62 36 M-31 18 l62 -36"/>
    </g>
    <use href="#lock" x="36" y="-44"/>
    <text y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#334155">Cold archive</text>
    <text y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a90">Glacier: written, never read by surprise</text>
  </g>

  <!-- hard drives on a shelf in a closet -->
  <g transform="translate(190 400)">
    <rect x="-80" y="-70" width="160" height="140" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <line x1="-80" y1="-24" x2="80" y2="-24" stroke="#8aa9ff" stroke-width="2"/>
    <line x1="-80" y1="22" x2="80" y2="22" stroke="#8aa9ff" stroke-width="2"/>
    <g fill="#eef2ff" stroke="#8aa9ff" stroke-width="1.6">
      <rect x="-64" y="-58" width="54" height="28" rx="4"/><rect x="6" y="-58" width="54" height="28" rx="4"/>
      <rect x="-64" y="-12" width="54" height="28" rx="4"/><rect x="6" y="-12" width="54" height="28" rx="4"/>
      <rect x="-64" y="34" width="54" height="28" rx="4"/>
    </g>
    <g fill="#8aa9ff"><circle cx="-18" cy="-44" r="3"/><circle cx="52" cy="-44" r="3"/><circle cx="-18" cy="2" r="3"/><circle cx="52" cy="2" r="3"/><circle cx="-18" cy="48" r="3"/></g>
    <use href="#lock" x="38" y="46"/>
    <text y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#334155">Disks on a shelf</text>
    <text y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a90">offline copies, counted and verified</text>
  </g>

  <!-- NAS / network share -->
  <g transform="translate(1010 400)">
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <g fill="#eef2ff" stroke="#8aa9ff" stroke-width="1.6">
      <rect x="-56" y="-36" width="112" height="18" rx="3"/><rect x="-56" y="-9" width="112" height="18" rx="3"/><rect x="-56" y="18" width="112" height="18" rx="3"/>
    </g>
    <g fill="#2bb673"><circle cx="46" cy="-27" r="3"/><circle cx="46" cy="0" r="3"/><circle cx="46" cy="27" r="3"/></g>
    <use href="#lock" x="52" y="-44"/>
    <text y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#334155">NAS at home</text>
    <text y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7a90">or a friend's, or a server</text>
  </g>

  <!-- laptop -->
  <g transform="translate(400 490)">
    <rect x="-62" y="-42" width="124" height="76" rx="7" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <rect x="-52" y="-32" width="104" height="56" rx="3" fill="url(#blocks)"/>
    <rect x="-76" y="34" width="152" height="8" rx="3" fill="#8aa9ff"/>
    <use href="#lock" x="40" y="-30"/>
    <text y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">Laptop</text>
  </g>

  <!-- phone -->
  <g transform="translate(800 490)">
    <rect x="-26" y="-50" width="52" height="94" rx="9" fill="#ffffff" fill-opacity="0.9" stroke="#8aa9ff" stroke-width="2"/>
    <rect x="-20" y="-40" width="40" height="70" rx="3" fill="url(#blocks)"/>
    <circle cy="38" r="3" fill="#8aa9ff"/>
    <use href="#lock" x="18" y="-46"/>
    <text y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">Phone</text>
  </g>
</svg>
