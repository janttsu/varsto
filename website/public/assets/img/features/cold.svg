<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Cold storage and cost-aware placement">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="laptop" filter="url(#sh)"><rect x="-50" y="-36" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-31" width="90" height="54" rx="3" fill="url(#sg)"/><rect x="-62" y="30" width="124" height="8" rx="4" fill="#cbd5e1"/><rect x="-12" y="30" width="24" height="3" rx="1.5" fill="#e8edf7"/></g><g id="cloud" filter="url(#sh)"><path transform="translate(-3 10)" d="M-38 16 A16 16 0 0 1 -30 -14 A22 22 0 0 1 10 -24 A19 19 0 0 1 40 -4 A14 14 0 0 1 38 16 Z" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" stroke-linejoin="round"/></g><g id="snow"><path d="M0 -13 V13 M-11.3 -6.5 L11.3 6.5 M-11.3 6.5 L11.3 -6.5" stroke="#8aa9ff" stroke-width="2" stroke-linecap="round"/><path d="M-3 -9 L0 -6 L3 -9 M-3 9 L0 6 L3 9 M-10.5 -1.5 L-7 -3 L-7 -6 M10.5 1.5 L7 3 L7 6 M-10.5 1.5 L-7 3 L-7 6 M10.5 -1.5 L7 -3 L7 -6" fill="none" stroke="#8aa9ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#laptop" x="100" y="116"/><rect x="68" y="94" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="82" y="94" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="96" y="94" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="110" y="94" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".8"/><rect x="124" y="94" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".3"/><rect x="68" y="108" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="82" y="108" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="96" y="108" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="110" y="108" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="124" y="108" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".8"/><rect x="68" y="122" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".3"/><rect x="82" y="122" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="96" y="122" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="110" y="122" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="124" y="122" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><text x="100" y="174" class="t m">Laptop</text><use href="#cloud" x="320" y="100"/><rect x="298" y="93" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="314" y="93" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="330" y="93" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><text x="320" y="152" class="t m">Hot storage</text><text x="320" y="170" class="s m">S3, NAS: read and write</text><g transform="translate(520 104)"><rect x="-40" y="-26" width="80" height="52" rx="7" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" filter="url(#sh)"/><path d="M-40 -12 H40" stroke="#8aa9ff" stroke-width="2"/><use href="#snow" y="7"/></g><text x="520" y="152" class="t m">Cold archive</text><text x="520" y="170" class="s m">Glacier: written,</text><text x="520" y="188" class="s m">never read by surprise</text><path class="d" d="M156 100 C 200 86, 236 82, 268 92"/><path class="d" d="M372 90 C 410 82, 442 86, 476 98"/><rect x="376" y="106" width="100" height="20" rx="10" fill="#fff" stroke="#8aa9ff" stroke-width="1.5"/><text x="426" y="120" class="m" style="font-size:11px;font-weight:600;fill:#2b57d6">ask before restore</text><text x="320" y="278" class="s m">Per-storage prices for upload, download and restore steer where data is written and read.</text><text x="320" y="296" class="s m">Cold storage is never read without an explicit confirmation that shows cost and delay.</text>
</svg>
