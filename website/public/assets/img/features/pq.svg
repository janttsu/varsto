<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A ledger batch with two seals, Ed25519 and ML-DSA-65, and a share token sealed with X25519 and ML-KEM-768">
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .t{font-size:14px;font-weight:600;fill:#334155} .s{font-size:12px;fill:#6b7a90} .k{font-size:11px;font-weight:600;fill:#1b3a9a}</style>
<rect x="40" y="60" width="260" height="150" rx="10" fill="#fff" stroke="#8aa9ff" stroke-width="2"/>
<text x="170" y="88" text-anchor="middle" class="t">Ledger batch #42</text>
<rect x="60" y="100" width="220" height="12" rx="3" fill="#8aa9ff" fill-opacity="0.45"/><rect x="60" y="118" width="180" height="12" rx="3" fill="#8aa9ff" fill-opacity="0.45"/><rect x="60" y="136" width="200" height="12" rx="3" fill="#8aa9ff" fill-opacity="0.45"/>
<circle cx="110" cy="180" r="16" fill="#2b57d6"/><text x="110" y="184" text-anchor="middle" fill="#fff" style="font-size:10px;font-weight:700">Ed</text><text x="110" y="205" text-anchor="middle" class="k">Ed25519</text>
<circle cx="230" cy="180" r="16" fill="#1b3a9a"/><text x="230" y="184" text-anchor="middle" fill="#fff" style="font-size:9px;font-weight:700">ML</text><text x="230" y="205" text-anchor="middle" class="k">ML-DSA-65</text>
<text x="170" y="235" text-anchor="middle" class="s">both signatures must verify</text>
<rect x="340" y="60" width="260" height="150" rx="10" fill="#fff" stroke="#8aa9ff" stroke-width="2"/>
<text x="470" y="88" text-anchor="middle" class="t">Share token</text>
<rect x="360" y="100" width="220" height="40" rx="6" fill="#eef2ff" stroke="#8aa9ff" stroke-width="1.5"/><text x="470" y="125" text-anchor="middle" class="s">folder key, sealed</text>
<circle cx="410" cy="180" r="16" fill="#2b57d6"/><text x="410" y="184" text-anchor="middle" fill="#fff" style="font-size:10px;font-weight:700">X</text><text x="410" y="205" text-anchor="middle" class="k">X25519</text>
<circle cx="530" cy="180" r="16" fill="#1b3a9a"/><text x="530" y="184" text-anchor="middle" fill="#fff" style="font-size:9px;font-weight:700">ML</text><text x="530" y="205" text-anchor="middle" class="k">ML-KEM-768</text>
<text x="470" y="235" text-anchor="middle" class="s">opens only on the requesting device</text>
<text x="320" y="285" text-anchor="middle" class="s">Classical and post-quantum together: breaking one is not enough.</text>
</svg>
