<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Untrusted replica: a device that holds encrypted copies it cannot open">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><pattern id="cb" width="28" height="28" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".6"/><rect x="16" y="2" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".3"/><rect x="2" y="16" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".38"/><rect x="16" y="16" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".7"/></pattern><g id="lock"><path d="M-5 -1 V-6.5 a5 5 0 0 1 10 0 V-1" fill="none" stroke="#1b3a9a" stroke-width="2.4" stroke-linecap="round"/><rect x="-8.5" y="-1.5" width="17" height="13.5" rx="3.2" fill="url(#pg)"/><circle cy="4" r="1.9" fill="#fff"/><rect x="-.9" y="4.5" width="1.8" height="3.6" rx=".9" fill="#fff"/></g><g id="lockb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#lock" y="-3"/></g><g id="ok"><circle r="11.5" fill="#fff"/><circle r="9.5" fill="#2bb673"/><path d="M-4.5 .2 L-1.2 3.4 L5 -3.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="key"><circle cx="-9" r="6.5" fill="none" stroke="#2b57d6" stroke-width="3"/><path d="M-2.5 0 H16 M10 0 v5 M15 0 v4" stroke="#2b57d6" stroke-width="3" fill="none" stroke-linecap="round"/></g><g id="keyb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#key" transform="scale(.8)"/></g><g id="laptop" filter="url(#sh)"><rect x="-50" y="-36" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-31" width="90" height="54" rx="3" fill="url(#sg)"/><rect x="-62" y="30" width="124" height="8" rx="4" fill="#cbd5e1"/><rect x="-12" y="30" width="24" height="3" rx="1.5" fill="#e8edf7"/></g><g id="nas" filter="url(#sh)"><rect x="-40" y="-26" width="80" height="52" rx="7" fill="url(#wg)" stroke="#cbd5e1" stroke-width="2"/><rect x="-30" y="-16" width="60" height="12" rx="3" fill="#e2e8f0"/><rect x="-30" y="2" width="60" height="12" rx="3" fill="#e2e8f0"/><circle cx="22" cy="-10" r="5" fill="#2bb673" fill-opacity=".25"/><circle cx="22" cy="-10" r="2.5" fill="#2bb673"/><circle cx="22" cy="8" r="2.5" fill="#2bb673"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
<use href="#laptop" x="110" y="112"/><path d="M78 94 h46 M78 104 h32 M78 114 h46 M78 124 h22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><use href="#keyb" x="150" y="80"/><text x="110" y="170" class="t m">You</text><text x="110" y="188" class="s m">holds the keys</text><rect x="250" y="56" width="140" height="126" rx="12" fill="url(#wg)" stroke="#8aa9ff" stroke-width="2" filter="url(#sh)"/><rect x="262" y="68" width="116" height="102" rx="6" fill="url(#cb)"/><use href="#lockb" x="388" y="58"/><text x="320" y="206" class="t m">Shared storage</text><use href="#nas" x="520" y="116"/><use href="#ok" x="556" y="92"/><text x="520" y="170" class="t m">Your friend's NAS</text><text x="520" y="188" class="s m">stores and verifies, cannot open</text><path class="dd" d="M160 110 L 242 110"/><path class="d" d="M398 110 L 474 110"/><text x="320" y="294" class="s m">A replica token lets a device hold and verify your copies without any key to read them.</text>
</svg>
