<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Transferrer: removable media carries what the other device lacks">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#2b57d6" fill-opacity=".08"/></pattern><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6ef2"/><stop offset="1" stop-color="#1b3a9a"/></linearGradient><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5a73"/><stop offset="1" stop-color="#1f2a3d"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b3a9a" flood-opacity=".14"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8aa9ff"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#2b57d6"/></marker><g id="lock"><path d="M-5 -1 V-6.5 a5 5 0 0 1 10 0 V-1" fill="none" stroke="#1b3a9a" stroke-width="2.4" stroke-linecap="round"/><rect x="-8.5" y="-1.5" width="17" height="13.5" rx="3.2" fill="url(#pg)"/><circle cy="4" r="1.9" fill="#fff"/><rect x="-.9" y="4.5" width="1.8" height="3.6" rx=".9" fill="#fff"/></g><g id="lockb"><circle r="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><use href="#lock" y="-3"/></g><g id="laptop" filter="url(#sh)"><rect x="-50" y="-36" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-31" width="90" height="54" rx="3" fill="url(#sg)"/><rect x="-62" y="30" width="124" height="8" rx="4" fill="#cbd5e1"/><rect x="-12" y="30" width="24" height="3" rx="1.5" fill="#e8edf7"/></g><g id="monitor" filter="url(#sh)"><rect x="-50" y="-38" width="100" height="66" rx="7" fill="url(#dg)"/><rect x="-45" y="-33" width="90" height="56" rx="3" fill="url(#sg)"/><rect x="-7" y="28" width="14" height="10" fill="#94a3b8"/><rect x="-26" y="36" width="52" height="5" rx="2.5" fill="#cbd5e1"/></g><g id="usb" filter="url(#sh)"><rect x="-34" y="-12" width="52" height="24" rx="6" fill="url(#pg)"/><rect x="18" y="-8" width="18" height="16" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><rect x="22" y="-4" width="4" height="3" fill="#64748b"/><rect x="22" y="1" width="4" height="3" fill="#64748b"/><circle cx="-24" r="2.5" fill="#8aa9ff"/></g></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12px;fill:#6b7a90}.n{font-size:12px;fill:#334155}.w{font-size:12px;font-weight:600;fill:#fff}.d{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah)}.dd{stroke:#8aa9ff;stroke-width:2;stroke-dasharray:6 5;fill:none;stroke-linecap:round;marker-end:url(#ah);marker-start:url(#ah)}.l{stroke:#2b57d6;stroke-width:2;fill:none;stroke-linecap:round;marker-end:url(#ahp);marker-start:url(#ahp)}.tr{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:7 6;fill:none;stroke-linecap:round}.m{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#dots)"/>
