ity=".65"/><rect x="526" y="100" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="540" y="100" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><rect x="554" y="100" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".8"/><rect x="498" y="114" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".3"/><rect x="512" y="114" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".55"/><rect x="526" y="114" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="540" y="114" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="554" y="114" width="9" height="9" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><text x="530" y="168" class="t m">Office PC</text><use href="#usb" transform="translate(320 96) scale(1.3)"/><use href="#lockb" x="290" y="70"/><rect x="314" y="58" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".65"/><rect x="329" y="58" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".35"/><rect x="344" y="58" width="10" height="10" rx="2.5" fill="#8aa9ff" fill-opacity=".5"/><text x="320" y="140" class="t m">Transferrer</text><text x="320" y="158" class="s m">USB stick or disk marked as carrier</text><path class="d" d="M158 96 C 204 84, 238 80, 272 86"/><path class="d" d="M370 86 C 404 80, 440 84, 478 96"/><text x="320" y="278" class="s m">Carries only the encrypted blocks the other device still lacks.</text><text x="320" y="296" class="s m">Both ends have it? The block is removed from the stick. No cloud needed.</text>
