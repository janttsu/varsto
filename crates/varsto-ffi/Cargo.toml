[package]
name = "varsto-ffi"
description = "C ABI for embedding the Varsto service in mobile apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "varsto_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
default = ["mimalloc", "format3"]
# mimalloc as the global allocator (see varsto-cli).
mimalloc = ["dep:mimalloc"]
# Storage format 3 work in progress (varsto-core `format3`).
format3 = ["varsto-core/format3"]

[dependencies]
varsto-core = { path = "../varsto-core" }
zeroize.workspace = true
mimalloc = { workspace = true, optional = true }
anyhow.workspace = true
log = { version = "0.4", features = ["std", "kv"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
hex.workspace = true
tiny_http.workspace = true
notify.workspace = true
sha2.workspace = true
walkdir.workspace = true
ed25519-dalek.workspace = true
blake2 = "0.10"
base64 = "0.22"
tempfile.workspace = true


[dev-dependencies]
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
