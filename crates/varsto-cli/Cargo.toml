[package]
name = "varsto-cli"
description = "Command-line interface of Varsto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "varsto"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# Use FSEvents instead of kqueue for folder watching (native macOS builds).
fsevents = ["notify/macos_fsevent"]
# `--software` security keys (a secret in a file): tests and the lab only.
software-key = ["varsto-core/software-key"]
# mimalloc as the global allocator: faster than the system allocator on the
# allocation-heavy paths (JSON, file lists, per-block buffers), much faster
# than musl's. Builds C; turn it off where no C compiler is at hand.
mimalloc = ["dep:mimalloc"]

[dependencies]
varsto-core = { path = "../varsto-core" }
zeroize.workspace = true
mimalloc = { workspace = true, optional = true }
tempfile.workspace = true
anyhow.workspace = true
log = { version = "0.4", features = ["std", "kv"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
tiny_http.workspace = true
notify.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
blake2 = "0.10"
base64 = "0.22"
walkdir.workspace = true
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
serde_json.workspace = true
