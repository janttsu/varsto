[package]
name = "varsto-cli"
description = "Command-line interface of Varsto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "varsto"
path = "src/main.rs"

[features]
# Use FSEvents instead of kqueue for folder watching (native macOS builds).
fsevents = ["notify/macos_fsevent"]

[dependencies]
varsto-core = { path = "../varsto-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
tiny_http.workspace = true
notify.workspace = true
sha2.workspace = true
walkdir.workspace = true
rpassword = "7"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
