[package]
name = "varsto-core"
description = "Core library of Varsto: chunking, encryption, storage backends, ledger and sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
rand_core.workspace = true
zeroize.workspace = true
argon2.workspace = true
hex.workspace = true
tiny_http.workspace = true
sha2.workspace = true
walkdir.workspace = true
image.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
tokio.workspace = true
ml-dsa = "0.1.1"
ml-kem = "0.3.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ureq = "3"
hmac = "0.12"
zstd = "0.13"
base64 = "0.22"
bip39 = "3"
unicode-normalization = "0.1"
sharks = "0.5"
spake2 = "0.4"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true
