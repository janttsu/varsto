[package]
name = "varsto-core"
description = "Core library of Varsto: chunking, encryption, storage backends, ledger and sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A "security key" whose secret is a plain file next to the vault, for
# tests and the lab only: it protects nothing beyond the passphrase, so
# release binaries are built without it.
software-key = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
rand_core.workspace = true
zeroize.workspace = true
argon2.workspace = true
hex.workspace = true
tiny_http.workspace = true
sha2.workspace = true
walkdir.workspace = true
image.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
tokio.workspace = true
ml-dsa = "0.1.1"
ml-kem = "0.3.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ureq = "3"
hmac = "0.12"
zstd = "0.13"
base64 = "0.22"
# QR codes for invitations: encode (SVG, terminal) and decode camera frames.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqrr = { version = "0.11.0", default-features = false }
data-encoding = "2.6"
bip39 = "3"
unicode-normalization = "0.1"
# Shamir shares over GF(256); the fork fixes RUSTSEC-2024-0398 in `sharks`.
blahaj = "0.6"
spake2 = "0.4"
log = { version = "0.4", features = ["std", "kv"] }
socket2 = { version = "0.6", features = ["all"] }
sha1 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
postcard = { version = "1", default-features = false, features = ["use-std"]}
smallvec = { version = "1.13", features = ["serde", "union"] }
# Rendezvous service (spec 83): the control channel and the relay stream are
# WebSockets. Blocking tungstenite without its TLS features: TLS is our own
# rustls (ring) with the roots ureq already uses. The same version as the
# server's axum, so one copy in the lock file.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true
# Integration tests stand in a software key for a FIDO2 authenticator.
varsto-core = { path = ".", features = ["software-key"] }
