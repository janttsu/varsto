[package]
name = "varsto-window"
description = "Native window of Varsto for Windows: the local web interface in WebView2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "varsto-window"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Security", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"
