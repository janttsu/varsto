# xcodegen project definition (brew install xcodegen)
name: Varsto
options:
  bundleIdPrefix: in.soderlund
  deploymentTarget:
    iOS: "16.0"
targets:
  Varsto:
    type: application
    platform: iOS
    sources: [Varsto]
    # xcodegen writes this Info.plist when it generates the project.
    info:
      path: Varsto/Info.plist
      properties:
        CFBundleDisplayName: Varsto
        UILaunchScreen: {}
        # Background app refresh (sync) and a processing task for camera upload; see Background.swift.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [in.soderlund.varsto.ios.refresh, in.soderlund.varsto.ios.camera-upload]
        # Camera upload reads new photos and videos; Varsto never changes or deletes them.
        NSPhotoLibraryUsageDescription: Camera upload reads new photos and videos on this phone and uploads them, encrypted, to the Varsto folder you choose. Varsto only reads them; the originals are never changed or deleted.
        # Varsto asks for full access itself; with limited access the status in Settings says so.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Pairing and peer-to-peer transfer talk to your other devices on the LAN.
        # (Finding them by broadcast also needs Apple's multicast entitlement;
        # until then pairing on iOS uses the address shown under the code.)
        NSLocalNetworkUsageDescription: Varsto pairs with and exchanges encrypted blocks with your own devices on this network.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Varsto/Varsto-Bridging-Header.h
        # One Rust static library per SDK; arm64 only (Apple Silicon Macs run the arm64 Simulator).
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(SRCROOT)/../../target/aarch64-apple-ios/release"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(SRCROOT)/../../target/aarch64-apple-ios-sim/release"]
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        OTHER_LDFLAGS: ["-lvarsto_ffi"]
        PRODUCT_BUNDLE_IDENTIFIER: in.soderlund.varsto.ios
