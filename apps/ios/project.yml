# xcodegen project definition (brew install xcodegen)
name: Varsto
options:
  bundleIdPrefix: in.soderlund
  deploymentTarget:
    iOS: "16.0"
targets:
  Varsto:
    type: application
    platform: iOS
    sources: [Varsto]
    # xcodegen writes this Info.plist when it generates the project.
    info:
      path: Varsto/Info.plist
      properties:
        CFBundleDisplayName: Varsto
        UILaunchScreen: {}
        # Overridden on the xcodebuild command line by make-ipa.sh.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Plain TLS from the core only (no export-compliance paperwork prompt for sideloading).
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Pairing and peer-to-peer transfer talk to your other devices on the LAN.
        # (Finding them by broadcast also needs Apple's multicast entitlement;
        # until then pairing on iOS uses the address shown under the code.)
        NSLocalNetworkUsageDescription: Varsto pairs with and exchanges encrypted blocks with your own devices on this network.
        # Scanning QR invitations and pairing codes in the page (getUserMedia in WKWebView).
        NSCameraUsageDescription: Varsto reads the QR code of a share invitation or a pairing code with the camera. Nothing is recorded.
        # varsto:// links: a QR code scanned with the Camera app opens Varsto.
        CFBundleURLTypes:
          - CFBundleURLName: in.soderlund.varsto.link
            CFBundleURLSchemes: [varsto]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Varsto/Varsto-Bridging-Header.h
        # One Rust static library per SDK; arm64 only (Apple Silicon Macs run the arm64 Simulator).
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(SRCROOT)/../../target/aarch64-apple-ios/release"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(SRCROOT)/../../target/aarch64-apple-ios-sim/release"]
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        OTHER_LDFLAGS: ["-lvarsto_ffi"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: in.soderlund.varsto.ios
