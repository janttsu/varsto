# Bitbucket Pipelines: test on every push, build release archives on tags.
# Uploading archives to the Downloads section needs a repository variable
# BITBUCKET_APP_PASSWORD (app password with "repository:write"); without it the
# archives are kept only as pipeline artifacts.
image: rust:1.90

definitions:
  caches:
    cargo: ~/.cargo/registry
    target: target
  steps:
    - step: &test
        name: Test, clippy, fmt
        caches: [cargo, target]
        script:
          - rustup component add clippy rustfmt
          - cargo fmt --all --check
          - cargo clippy --workspace --all-targets -- -D warnings
          - cargo test --workspace
    - step: &release
        name: Build release archives
        caches: [cargo]
        script:
          - apt-get update && apt-get install -y --no-install-recommends musl-tools mingw-w64 zip
          - rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
          - website/build-release.sh
          - python3 website/build.py
          - ls -l website/public/downloads
          - |
            if [ -n "${BITBUCKET_APP_PASSWORD:-}" ]; then
              for f in website/public/downloads/varsto-*; do
                curl -sS -u "$BITBUCKET_REPO_OWNER:$BITBUCKET_APP_PASSWORD" -X POST \
                  "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/downloads" -F files=@"$f"
              done
            fi
        artifacts:
          - website/public/downloads/**

pipelines:
  default:
    - step: *test
  branches:
    main:
      - step: *test
  tags:
    'v*':
      - step: *test
      - step: *release
